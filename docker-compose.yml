services:
  getcid:
    build: .
    container_name: getcid
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - WC_URL=${WC_URL}
      - WC_CONSUMER_KEY=${WC_CONSUMER_KEY}
      - WC_CONSUMER_SECRET=${WC_CONSUMER_SECRET}
      - GETCID_SERVICE_URL=http://getcid_python:8000
      - PID_CHECKER_URL=http://pid_checker_api:8000
    depends_on:
      getcid_python:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  getcid_python:
    build: ./getcid_service
    container_name: getcid_python
    restart: unless-stopped
    init: true  # Usa tini como PID 1 → mata procesos zombie de Chrome/Playwright automáticamente
    volumes:
      - ./python_data:/app/persist
    environment:
      - MS_ACCOUNTS=${MS_ACCOUNTS}
      - MS_EMAIL=${MS_EMAIL}
      - MS_PASSWORD=${MS_PASSWORD}
      - FORCE_HEADLESS=true
      - IS_SERVER=true
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - NOCAPTCHAAI_API_KEY=${NOCAPTCHAAI_API_KEY}
      - AI_SOLVER_ENABLED=${AI_SOLVER_ENABLED}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GETCID_SERVER=http://localhost:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # 2 min: boot validator puede tardar con Playwright

  pid_checker_api:
    build: ./pid_checker_api
    container_name: pid_checker_api
    restart: unless-stopped
    ports:
      - "8085:8000"
    environment:
      - APP_ENV=production
      - RATE_LIMIT_PER_MINUTE=10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
