version: '3.8'

services:
  getcid_backend:
    build: .
    container_name: getcid_backend
    restart: always
    volumes:
      - ./logs:/app/logs
    environment:
      - TZ=America/Lima

  getcid_frontend:
    build: ./frontend
    container_name: getcid_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/data:/app/data
      - ./frontend/uploads:/app/uploads
      - ./logs:/app/logs
    command: sh -c "mkdir -p /app/logs && node index.js >> /app/logs/frontend.log 2>&1"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - WC_URL=${WC_URL}
      - WC_CONSUMER_KEY=${WC_CONSUMER_KEY}
      - WC_CONSUMER_SECRET=${WC_CONSUMER_SECRET}
      - GETCID_SERVICE_URL=http://getcid_backend:8000
    depends_on:
      - getcid_backend
